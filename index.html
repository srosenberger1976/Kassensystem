 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #000000 !important; font-weight: 900 !important; }
 body { background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%); min-height: 100vh; padding: 20px; text-align: center; position: relative; }

 .view-toggle-btn { position: fixed; top: 15px; right: 15px; width: 60px; height: 60px; padding: 0; background: #ffffff; color: #000000; border: 4px solid #000000; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 1000; box-shadow: 0 6px 12px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
 .curved-title { position: relative; display: inline-block; margin: 20px auto 35px; color: #000000; font-size: 42px; text-transform: uppercase; transform: perspective(100px) rotateX(10deg); }

 .mode-sub-container { max-width: 1400px; margin: 0 auto 20px; display: flex; gap: 15px; animation: fadeIn 0.2s ease-out; }
 .mode-btn { flex: 1; padding: 24px 15px; font-size: 22px; border: 4px solid #000000; border-radius: 16px; background: #ffffff; color: #000000; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
 .mode-btn.act-cash { background: #52ecce !important; border-color: #000000; }
 .mode-btn.act-ev { background: #d8b4fe !important; border-color: #000000; }
 .nav-btn { flex: 1; padding: 26px; font-size: 28px; border: 4px solid #000000; border-radius: 16px; color: #000000; background: #e2e8f0; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
 .nav-btn.active { background: #60a5fa !important; border-color: #000000; }

 .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; max-width: 1400px; margin: 0 auto; min-height: 550px; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.2); border: 4px solid #000000; }
 .btn { background: #ffffff; color: #000000; border: 4px solid #cbd5e1; padding: 16px 10px; font-size: 20px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 150px; cursor: pointer; height: 100%; width: 100%; user-select: none; -webkit-user-select: none; }
 .btn.active-user { background: #4ade80 !important; border-color: #000000 !important; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
 .btn.paid-user { background: #facc15 !important; border-color: #000000 !important; }
 .btn.empty-credit { background: #f87171 !important; border-color: #000000 !important; }
 .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: flex-start; z-index: 100; padding: 20px 10px; backdrop-filter: blur(3px); overflow-y: auto; }

 .popup { background: #ffffff; width: 100%; max-width: 95vw; border-radius: 24px; padding: 25px; display: flex; flex-direction: column; gap: 12px; margin: auto; box-shadow: 0 25px 35px -5px rgba(0,0,0,0.4); border: 5px solid #000000; max-height: 96vh; overflow-y: auto; }
 #reader { width: 100% !important; max-width: 500px; margin: 0 auto; border: 4px solid #000000 !important; border-radius: 16px; overflow: hidden; background: #fafafa; }
 #reader button { background: #60a5fa !important; color: #000 !important; font-size: 18px !important; padding: 12px !important; border: 3px solid #000 !important; border-radius: 10px !important; margin: 10px auto !important; cursor: pointer; font-weight: bold !important; }
 #reader video { border-radius: 12px; }
 .m-btn { background: #4ade80; color: #000000; padding: 20px; border: 4px solid #000000; border-radius: 14px; font-size: 24px; cursor: pointer; }
 .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; grid-auto-rows: minmax(110px, auto); }

 .list-wrap { max-height: 40vh; overflow-y: auto; text-align: left; }
 .l-item { padding: 14px 0; border-bottom: 3px solid #000000; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
 .item-btn { background: #f1f5f9; color: #000000; padding: 16px 10px; border: 4px solid #000000; border-radius: 14px; font-size: 20px; white-space: pre-line; min-height: 110px !important; display: flex; flex-direction: column; justify-content: center; align-items: center; }
 .path-indicator { background: #ccfbf1; color: #000000; padding: 12px; border-radius: 10px; font-size: 16px; text-transform: uppercase; margin-bottom: 6px; border: 3px solid #000000; width: 100%; text-align: center; }
 .datetime-label { font-size: 20px; color: #000000; margin-bottom: 10px; border-bottom: 3px dashed #000000; padding-bottom: 10px; text-align: left; }
 .control-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; background: #fffaf0; color: #dd6b20; border: 3px solid #feebc8; padding: 15px; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; }
 .control-text { font-size: 22px; font-weight: 900 !important; text-align: left; flex: 1; }
 .inline-storno-btn { background: #f87171; color: #000000; padding: 12px 20px; border: 3px solid #000000; border-radius: 12px; font-size: 20px; cursor: pointer; white-space: nowrap; }
 .sub-scroll-wrap { max-height: 70vh; overflow-y: auto; padding-right: 8px; width: 100%; }
 body.force-mobile { padding: 10px; } body.force-mobile .curved-title { font-size: 30px; margin: 15px auto 20px; } body.force-mobile .flex-box { gap: 10px; margin-bottom: 12px; } body.force-mobile .main-event-btn { padding: 18px; font-size: 22px; margin-bottom: 12px; border-width: 3px; } body.force-mobile .mode-btn { padding: 18px 10px; font-size: 18px; border-width: 3px; } body.force-mobile .nav-btn { padding: 18px; font-size: 22px; border-width: 3px; } body.force-mobile .top-btn { min-width: 90px; padding: 14px 6px; font-size: 16px; border-width: 3px; } body.force-mobile .grid-container { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; min-height: 400px; border-width: 3px; } body.force-mobile .btn { min-height: 110px; font-size: 16px; padding: 12px 6px; border-radius: 12px; border-width: 3px; } body.force-mobile .popup { padding: 20px; max-width: 100%; border-width: 4px; } body.force-mobile .m-btn { padding: 16px; font-size: 20px; border-width: 3px; } body.force-mobile .item-grid { grid-template-columns: 1fr 1fr; gap: 10px; } body.force-mobile .item-btn { padding: 14px; font-size: 16px; border-width: 3px; min-height: 70px; } body.force-mobile .sub-scroll-wrap { max-height: 42vh; }
 @media (max-width: 768px) { body { padding: 10px; } .curved-title { font-size: 30px; margin: 15px auto 20px; } .flex-box { gap: 10px; margin-bottom: 12px; } .main-event-btn { padding: 18px; font-size: 22px; margin-bottom: 12px; border-width: 3px; } .mode-btn { padding: 18px 10px; font-size: 18px; border-width: 3px; } .nav-btn { padding: 18px; font-size: 22px; border-width: 3px; } .top-btn { min-width: 90px; padding: 14px 6px; font-size: 16px; border-width: 3px; } .grid-container { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; min-height: 400px; border-width: 3px; } .btn { min-height: 110px; font-size: 16px; padding: 12px 6px; border-radius: 12px; border-width: 3px; } .popup { padding: 20px; max-width: 100%; border-width: 4px; } .m-btn { padding: 16px; font-size: 20px; border-width: 3px; } .item-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .item-btn { padding: 14px; font-size: 16px; border-width: 3px; min-height: 70px; } .sub-scroll-wrap { max-height: 42vh; } }
 @media print { body { background: white !important; color: black !important; padding: 0; } .overlay { display: none !important; position: static !important; background: none !important; backdrop-filter: none !important; padding: 0; } .overlay[style*="display: flex"], .overlay[style*="display: block"] { display: block !important; } .popup { max-width: 100% !important; box-shadow: none !important; padding: 0; margin: 0; border: none !important; } .m-btn, .flex-box, .main-event-btn, #subBackBtn, #subStornoBtn, .item-grid, .curved-title, .grid-container, input, select, #cashCalc, #payBtn, .view-toggle-btn { display: none !important; } .l-item { border-bottom: 2px solid #000 !important; padding: 8px 0 !important; font-size: 18px !important; } .datetime-label { display: block !important; font-size: 14px !important; font-weight: bold !important; margin-bottom: 15px !important; } }
 @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
 </style>
</head>

<body>
 <button class="view-toggle-btn" onclick="toggleViewMode()" id="viewToggleBtn">PC</button>
 <div class="curved-title">Dart - Getraenkeverkauf 2026</div>
 
 <div class="flex-box" style="margin-bottom: 15px;">
 <button class="main-event-btn" style="background:#60a5fa; color:#000; margin: 0; flex: 1;" onclick="openScannerPopup()">Karte einscannen (Kamera)</button>

 <button class="top-btn" style="background:#93c5fd; border: 2px solid #000;" onclick="showList('rest')">Verkauft</button>
 <button class="top-btn" style="background:#86efac; font-weight: 900; border: 2px solid #000;" onclick="showList('alles')">Alles</button>
 <button class="top-btn" style="background:#fef08a; border: 2px solid #000;" onclick="openData()">Daten</button>
 <button class="top-btn" style="background:#fca5a5; border: 2px solid #000;" onclick="resetAll()">Reset</button>
 </div>
 
 <div class="mode-sub-container" id="eventMenu" style="display: none; margin-bottom: 15px;">
 <button id="mBar" class="mode-btn act-cash" onclick="setMode(false)">Verkauf Bargeld</button>
 <button id="mGut" class="mode-btn" onclick="setMode(true)">Verkauf Guthaben</button>
 </div>
 
 <div class="grid-container" id="box" style="margin-top: 20px;">
   <button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button><button class="btn">Leer</button>
 </div>

 <div class="overlay" id="popScanner" style="display: none;">
 <div class="popup" style="max-width:550px;">
 <h3>Karte einscannen</h3>
 <!-- Ein echtes Video-Element fuer das Pixel 8a -->
 <video id="pixelVideo" autoplay playsinline style="width: 100%; max-width: 500px; border: 4px solid #000000; border-radius: 16px; background: #fafafa; margin: 10px 0;"></video>
 <div style="display: flex; gap: 10px; margin-top: 10px;">
 <button class="m-btn" style="background:#f59e0b; flex: 1; border-color:#000;" onclick="spielVorbei()">Spiel vorbei</button>
 <button class="m-btn" style="background:#cbd5e1; flex: 1; border-color:#000;" onclick="closeScannerPopup()">Schließen</button>
 </div>
 </div>
 </div>


<div class="overlay" id="popName" style="display: none;">
 <div class="popup">
 <h3 id="nameAssignTitle">Name zuweisen</h3>
 <input type="text" id="drop" list="nameSuggestions" style="padding:10px; border-radius:8px; border:2px solid #000; font-size:18px;" placeholder="Name suchen...">
 <datalist id="nameSuggestions"></datalist>
 <input type="text" id="inp" style="padding:10px; border-radius:8px; border:2px solid #000; font-size:18px;" placeholder="Oder manuell eingeben">
 <button class="m-btn" onclick="saveName()">Bestätigen</button>
 <button class="m-btn" style="background:#e2e8f0; border: 2px solid #000;" onclick="closeAll()">Abbrechen</button>
 </div>
</div>

 <div class="overlay" id="popMenu" style="display: none;">
 <div class="popup">
 <div class="path-indicator">HAUPTMENUE</div>
 <h3 id="mTitle" style="font-size: 28px; margin-bottom: 2px;">Name</h3>
 <div style="font-size: 24px; color:#3182ce; margin-bottom: 4px;" id="mSub">Verzehrt: 0.00 €</div>
 <div id="mCred" style="display:none; background:#e6fffa; padding:10px; border-radius:12px; font-size: 22px; border: 3px solid #047857; margin-bottom: 4px;"></div>
 
 <button class="m-btn" style="background:#60a5fa; border-color: #000; margin-bottom: 4px;" onclick="openInvoice()">Abrechnung einsehen</button>
 <button class="m-btn" style="background:#34d399; display:none; border-color: #000; margin-bottom: 4px;" id="mAddC" onclick="openAddCPop()">Guthaben aufladen (+)</button>
 
 <div class="item-grid">
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('biere')">Biere</button>
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('weine')">Weine</button>
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('softdrinks')">Softdrinks</button>
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('spirituosen')">Spirituosen</button>
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('essen')">Essen</button>
 <button class="m-btn" style="background:#e2e8f0; border-color: #000;" onclick="openSub('sonstiges')">Sonstiges</button>
 </div>
 
 <div style="display: flex; gap: 10px; margin-top: 10px;">
 <button class="m-btn" style="background:#f87171; flex: 1; border-color: #000;" onclick="storno()">Letzte Buchung löschen</button>
 <button class="m-btn" style="background:#cbd5e1; flex: 1; border-color: #000;" onclick="closeAll()">Schließen</button>
 </div>
 </div>
 </div>

 <div class="overlay" id="popSub" style="display: none;">
 <div class="popup">
 <div class="path-indicator" id="subPath">HAUPTMENUE</div>
 <div id="subLastSelection" class="control-bar" style="display: none;">
 <div class="control-text" id="subLastSelectionText">Zuletzt gewählt: </div>
 <button class="inline-storno-btn" id="subStornoBtn">Stornieren</button>
 </div>
 <h3 id="sTitle" style="font-size: 24px; text-align: left; margin-bottom: 4px;">SCHNAEPSE</h3>
 <div class="sub-scroll-wrap"><div class="item-grid" id="sGrid"></div></div>
 <div style="display:flex; gap:10px; margin-top: 5px;">
 <button class="m-btn" style="background:#e2e8f0; flex:1; border-color: #000;" id="subBackBtn">Zurück</button>
 <button class="m-btn" style="background:#60a5fa; flex:1; border-color: #000;" onclick="closeAll()">Verlassen</button>
 </div>
 </div>
 </div>

 <div class="overlay" id="popAddC" style="display: none;">
 <div class="popup">
 <h3>Guthaben aufladen</h3>
 <div class="item-grid">
 <button class="m-btn" style="background:#60a5fa; border-color:#000;" onclick="addCreditAmount(5)">+ 5 €</button>
 <button class="m-btn" style="background:#60a5fa; border-color:#000;" onclick="addCreditAmount(10)">+ 10 €</button>
 <button class="m-btn" style="background:#60a5fa; border-color:#000;" onclick="addCreditAmount(20)">+ 20 €</button>
 <button class="m-btn" style="background:#60a5fa; border-color:#000;" onclick="addCreditAmount(50)">+ 50 €</button>
 </div>
 <button class="m-btn" style="background:#f87171; border-color:#000;" onclick="undoLastCredit()">Letzte Aufladung stornieren</button>
 <button class="m-btn" style="background:#cbd5e1; border-color:#000;" onclick="closeAddCPop()">Zurück</button>
 </div>
 </div>

 <div class="overlay" id="popInvoice" style="display: none;">
 <div class="popup">
 <h3>Rechnung</h3>
 <div class="datetime-label" id="iDateTime">Datum/Uhrzeit: </div>
 <div class="list-wrap" id="iContent"></div>

 <div id="iEv" style="display:none; background:#ecfdf5; padding:10px; border-radius:12px; border:2px solid #000; margin:4px 0; font-size:20px;"></div>

 <label style="font-size:18px; font-weight:bold;">Geliefert (€):</label>
 <input type="text" id="cashGiven" style="width:100%; padding:10px; margin-top:5px; border-radius:8px; border:3px solid #000; font-size:20px;" oninput="calcChange()">
 <p id="cashChange" style="font-weight:bold; color:#dd6b20; font-size:22px; margin-top:6px;">Rückgeld: 0.00 €</p>
 </div>
 <button class="m-btn" id="payBtn" onclick="pay()" style="display: block;">Als bezahlt markieren (Gelb)</button>
 <button class="m-btn" style="background:#cbd5e1; border-color:#000;" onclick="closeAll()">Zurück</button>
 </div>
 </div>

 <div class="overlay" id="popData" style="display: none;">
 <div class="popup" style="max-width:600px;">
 <h3>Daten-Einstellungen</h3>
 <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:18px; margin-bottom: 8px;">
 <label>Gitter Buttons:</label>
 <input type="number" id="vGridCount" style="width:70px; padding:6px; border-radius:8px; border:3px solid #000; font-size:18px;" min="1" max="100">
 </div>
 <div style="display:flex; gap:10px; margin-bottom: 12px;">
 <button class="m-btn" style="background:#a7f3d0; flex:1; font-size:16px; padding:10px;" onclick="exportJSON()">JSON Speichern</button>
 <button class="m-btn" style="background:#fde047; flex:1; font-size:16px; padding:10px;" onclick="document.getElementById('jsonFileInput').click()">JSON Laden</button>

 </div>
 <label style="display:block; text-align:left; margin-top:5px; font-weight:bold; font-size:16px;">Alle Daten (Spieler &amp; Menü):</label>
 <textarea id="vAllData" style="height:250px; width:100%; padding:8px; border-radius:8px; border:3px solid #000; font-size:14px; font-family:monospace;"></textarea>
 <button class="m-btn" onclick="saveData()">Speichern</button>
 <button class="m-btn" style="background:#cbd5e1; border-color:#000;" onclick="closeAll()">Schließen</button>
 </div>
 </div>

 <div class="overlay" id="popList" style="display: none;">

 <button class="m-btn" style="background:#cbd5e1; border-color:#000;" onclick="closeAll()">Schließen</button>
 </div>
 </div>

 function undoLastCredit() { if(lastLoadAmt <= 0) { alert("Keine ladbare Aktion im Cache!"); return; } const d = (tab === 'heim' ? dbH : dbG)[idx]; if(d.credit >= lastLoadAmt) { d.credit -= lastLoadAmt; d.dep -= lastLoadAmt; save(); alert("Letzte Aufladung von " + lastLoadAmt + " € wurde rückgängig gemacht!"); lastLoadAmt = 0; closeAddCPop(); } else { alert("Guthaben wurde bereits verbraucht!"); } }
 function book(n, p, c) { if(!confirm("Möchtest du '" + n + "' für " + p.toFixed(2) + " € wirklich buchen?")) return; const d = (tab === 'heim' ? dbH : dbG)[idx]; if(isEv && d.credit < p) { alert(' Guthaben reicht nicht!\nEs fehlen noch ' + (p - d.credit).toFixed(2) + ' €.'); return; } if(!d.items) d.items = []; if(!d.rec) d.rec = []; d.items.push({n: n, p: p, c: c}); d.total += p; if(isEv) d.credit -= p; d.paid = false; d.rec.unshift(n + ' (' + p.toFixed(2) + '€)'); save(); const infoBox = document.getElementById('subLastSelection'); document.getElementById('subLastSelectionText').innerText = "Zuletzt gewählt: " + n + " - " + p.toFixed(2) + " €"; infoBox.style.display = 'flex'; }
 function storno(fromSub = false) { const d = (tab === 'heim' ? dbH : dbG)[idx]; if(!d.items || !d.items.length) { alert("Keine Buchungen vorhanden!"); return; } const i = d.items.pop(); d.total -= i.p; if(isEv) d.credit += i.p; if(d.rec) d.rec.shift(); save(); alert("Letzte Buchung (" + i.n + ") gelöscht!"); document.getElementById('subLastSelection').style.display = 'none'; if(fromSub) { document.getElementById('popSub').style.display = 'none'; openMenu(); } else { openMenu(); } }

 function spielVorbei() { if (!confirm("Möchtest du das Spiel beenden und alle Namen der Gastkarten leeren?")) return; for (let i = 1; i <= gridCount; i++) { if (dbH[i] && dbH[i].ean && dbH[i].ean.toLowerCase().includes("gast")) { dbH[i].name = dbH[i].ean; } if (dbG[i] && dbG[i].ean && dbG[i].ean.toLowerCase().includes("gast")) { dbG[i].name = dbG[i].ean; } } save(); draw(); alert("Alle Gastkarten wurden zurückgesetzt!"); }
 let barcodeBuffer = "";
 window.addEventListener("keydown", function(e) { if (e.key === "Enter") { if (barcodeBuffer.length >= 3) { processScannedCode(barcodeBuffer.trim()); } barcodeBuffer = ""; } else if (e.key.length === 1) { barcodeBuffer += e.key; } });
 function processScannedCode(code) { let cleanCode = code.trim(); let lowerCode = cleanCode.toLowerCase(); for (let i = 1; i <= gridCount; i++) { if (dbH[i] && dbH[i].ean === cleanCode) { idx = i; tab = 'heim'; openMenu(); return; } if (dbG[i] && dbG[i].ean === cleanCode) { idx = i; tab = 'gaeste'; openMenu(); return; } } if (lowerCode.includes("gast")) { tab = 'gaeste'; let freeIdx = null; for (let i = 1; i <= gridCount; i++) { if (!dbG[i] || !dbG[i].name) { freeIdx = i; break; } } if (freeIdx) { idx = freeIdx; dbG[idx] = { name: cleanCode, ean: cleanCode, items: [], total: 0, credit: 0, dep: 0, paid: false, rec: [] }; save(); openNameForScannedCard(cleanCode, cleanCode); } else { alert("Kein freier Platz im Gaeste-Gitter!"); } return; } tab = 'heim'; let foundName = ""; tH.forEach(n => { if(n && n.includes(';')) { const parts = n.split(';'); if(parts && parts && parts.trim() === cleanCode) { foundName = parts.trim(); } } }); const curDb = dbH; let freeIdx = null; for (let i = 1; i <= gridCount; i++) { if (!curDb[i] || !curDb[i].name) { freeIdx = i; break; } } if (!freeIdx) { alert("Kein freier Platz im Heim-Gitter!"); return; } idx = freeIdx; if (foundName) { curDb[idx] = { name: foundName, ean: cleanCode, items: [], total: 0, credit: 0, dep: 0, paid: false, rec: [] }; save(); openMenu(); } else { curDb[idx] = { name: cleanCode, ean: cleanCode, items: [], total: 0, credit: 0, dep: 0, paid: false, rec: [] }; save(); openNameForScannedCard("Heimspieler", cleanCode); } }

 function parseLinesFromSection(lines, cat) { return lines.map(l => { if (!l || !l.includes(';')) return null; const parts = l.split(';'); return {n: parts.trim(), p: parseFloat(parts.replace(',','.'))||0, c: cat}; }).filter(x => x); }
 let html5QrcodeScanner = null; let cameraStream = null; let scanInterval = null;





 function openScannerPopup() {
    document.getElementById('popScanner').style.display = 'flex';
    const video = document.getElementById('pixelVideo');
    if (!html5QrcodeScanner) { html5QrcodeScanner = new Html5Qrcode("reader"); }

    if ('BarcodeDetector' in window) {
        video.style.display = 'block';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            cameraStream = stream; video.srcObject = stream;
            const detector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8'] });
            scanInterval = setInterval(() => {
                if (!cameraStream) return;
                detector.detect(video).then(barcodes => { 
                    if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) { 
                        let c = barcodes[0].rawValue.trim().replace(']C1', ''); 
                        closeScannerPopup(); processScannedCode(c); 
                    } 
                }).catch(() => {});
            }, 300);
        }).catch(() => { alert("Kamera blockiert!"); });
    } else {
        video.style.display = 'none';
        html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, 
            (txt) => { let c = txt.trim().replace(']C1', ''); closeScannerPopup(); processScannedCode(c); }, 
            () => {}
        ).catch(() => { alert("iPhone Kamera blockiert!"); });
    }
 }


 function closeScannerPopup() {
    if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
    if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) { html5QrcodeScanner.stop().catch(() => {}); }
    document.getElementById('popScanner').style.display = 'none';
 }

 function showList(m) { const c = document.getElementById('lContent'); c.innerHTML = ''; let s = 0; if (m === 'essen') document.getElementById('lTitle').innerText = 'Essen-Liste'; else if (m === 'spirituosen') document.getElementById('lTitle').innerText = 'Spirituosen-Liste'; else if (m === 'rest') document.getElementById('lTitle').innerText = 'Gesamt (Ohne Essen)'; else if (m === 'alles') document.getElementById('lTitle').innerText = 'Absolute Gesamtabrechnung'; const counts = {}; const processData = (d) => { Object.values(d).forEach(p => { if(p.items) { p.items.forEach(i => { const isJacky = i.n.toLowerCase().includes('jacky'); if (m === 'alles') { counts[i.n] = (counts[i.n] || 0) + 1; s += i.p; } else if (m === 'essen' && i.c === 'essen') { counts[i.n] = (counts[i.n] || 0) + 1; s += i.p; } else if (m === 'spirituosen' && i.c === 'spirituosen' && isJacky) { counts[i.n] = (counts[i.n] || 0) + 1; s += i.p; } else if (m === 'rest' && i.c !== 'essen' && !(i.c === 'spirituosen' && isJacky)) { counts[i.n] = (counts[i.n] || 0) + 1; s += i.p; } }); } }); }; processData(dbH); processData(dbG); Object.entries(counts).forEach(([name, count]) => { let unitPrice = 0; const findPrice = (d) => { Object.values(d).forEach(p => { if(p.items) { const found = p.items.find(item => item.n === name); if(found) unitPrice = found.p; } }); }; findPrice(dbH); if(unitPrice === 0) findPrice(dbG); const div = document.createElement('div'); div.className = 'l-item'; div.innerHTML = '<div><strong>' + count + 'x</strong> ' + name + '</div><strong>' + (count * unitPrice).toFixed(2) + ' €</strong>'; c.appendChild(div); }); const tDiv = document.createElement('div'); tDiv.className = 'l-item'; tDiv.style.borderTop = '3px double #333'; tDiv.innerHTML = '<div><strong>GESAMT:</strong></div><strong>' + s.toFixed(2) + ' €</strong>'; c.appendChild(tDiv); document.getElementById('popList').style.display = 'flex'; }
 function openData() { document.getElementById('vGridCount').value = gridCount; let txt = '[Heim]\n' + tH.filter(n => n && !n.includes('--')).join('\n') + '\n\n'; txt += '[Gast]\n' + tG.filter(n => n && !n.includes('--')).join('\n') + '\n\n'; txt += '[Biere]\n' + makeLines(menu.biere) + '\n\n'; txt += '[Weizen]\n' + makeLines(menu.weizen) + '\n\n'; txt += '[BiereAlk]\n' + makeLines(menu.biere_alk) + '\n\n'; txt += '[Weine]\n' + makeLines(menu.weine) + '\n\n'; txt += '[Softdrinks]\n' + makeLines(menu.softdrinks) + '\n\n'; txt += '[Jacky]\n' + makeLines(menu.sub_jacky) + '\n\n'; txt += '[Huetchen]\n' + makeLines(menu.sub_huetchen) + '\n\n'; txt += '[Schnaepse]\n' + makeLines(menu.sub_schnaepse) + '\n\n'; txt += '[Essen]\n' + makeLines(menu.essen) + '\n\n'; txt += '[Sonstiges]\n' + makeLines(menu.sonstiges); document.getElementById('vAllData').value = txt; document.getElementById('popData').style.display = 'flex'; }
 function getSectionLines(text, sectionName) { const regex = new RegExp('\\[' + sectionName + '\\]([\\s\\S]*?)(?=\\[|\$)', 'i'); const match = text.match(regex); return match ? match.trim().split('\n').map(l => l.trim()).filter(l => l) : []; }

 function exportJSON() { try { const backupData = { dbH: JSON.parse(localStorage.getItem('dbH')) || {}, dbG: JSON.parse(localStorage.getItem('dbG')) || {}, tH: JSON.parse(localStorage.getItem('tH')) || [], tG: JSON.parse(localStorage.getItem('tG')) || {}, fullMenu: JSON.parse(localStorage.getItem('fullMenu')) || {}, gridCount: parseInt(localStorage.getItem('gridCount')) || 20, isEv: JSON.parse(localStorage.getItem('isEv')) || false }; const now = new Date(); const matchDate = now.toLocaleDateString('de-DE').replace(/\./g, "-"); const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2)); const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `kassensystem_spieltag_${matchDate}.json`); document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove(); } catch (err) { alert("Fehler beim Exportieren der Daten: " + err.message); } }
 function importJSON(input) { const file = input.files; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const importedData = JSON.parse(e.target.result); if (!importedData.dbH || !importedData.dbG || !importedData.fullMenu) { throw new Error("Ungueltiges Dateiformat."); } if (!confirm("Moechtest du diese JSON-Datei wirklich laden?")) { input.value = ''; return; } localStorage.setItem('dbH', JSON.stringify(importedData.dbH)); localStorage.setItem('dbG', JSON.stringify(importedData.dbG)); if(importedData.tH) localStorage.setItem('tH', JSON.stringify(importedData.tH)); if(importedData.tG) localStorage.setItem('tG', JSON.stringify(importedData.tG)); localStorage.setItem('fullMenu', JSON.stringify(importedData.fullMenu)); if(importedData.gridCount) localStorage.setItem('gridCount', importedData.gridCount); if(importedData.isEv !== undefined) localStorage.setItem('isEv', importedData.isEv); dbH = importedData.dbH; dbG = importedData.dbG; if(importedData.tH) tH = importedData.tH; if(importedData.tG) tG = importedData.tG; menu = importedData.fullMenu; if(importedData.gridCount) gridCount = parseInt(importedData.gridCount); if(importedData.isEv !== undefined) isEv = importedData.isEv; input.value = ''; closeAll(); alert("Daten erfolgreich geladen!"); } catch (err) { alert("Fehler: " + err.message); input.value = ''; } }; reader.readAsText(file); }
 function saveData() { gridCount = parseInt(document.getElementById('vGridCount').value) || 20; localStorage.setItem('gridCount', gridCount); const txt = document.getElementById('vAllData').value; const h = getSectionLines(txt, 'Heim'), g = getSectionLines(txt, 'Gast'); if(h.length) tH = ["--- Waehlen ---", ...h]; if(g.length) tG = ["--- Waehlen ---", ...g]; const b = parseLinesFromSection(getSectionLines(txt, 'Biere'), 'biere'); if(b.length) menu.biere = [{n: "Weizen", sub: "weizen"}, {n: "Alkoholfreie Biere", sub: "biere_alk"}, ...b]; const w = parseLinesFromSection(getSectionLines(txt, 'Weizen'), 'biere'); if(w.length) menu.weizen = w; const ba = parseLinesFromSection(getSectionLines(txt, 'BiereAlk'), 'biere'); if(ba.length) menu.biere_alk = ba; const wn = parseLinesFromSection(getSectionLines(txt, 'Weine'), 'weine'); if(wn.length) menu.weine = wn; const s = parseLinesFromSection(getSectionLines(txt, 'Softdrinks'), 'softdrinks'); if(s.length) menu.softdrinks = s; const j = parseLinesFromSection(getSectionLines(txt, 'Jacky'), 'spirituosen'); if(j.length) menu.sub_jacky = j; const hc = parseLinesFromSection(getSectionLines(txt, 'Huetchen'), 'spirituosen'); if(hc.length) menu.sub_huetchen = hc; const sc = parseLinesFromSection(getSectionLines(txt, 'Schnaepse'), 'spirituosen'); if(sc.length) menu.sub_schnaepse = sc; const e = parseLinesFromSection(getSectionLines(txt, 'Essen'), 'essen'); if(e.length) menu.essen = e; const so = parseLinesFromSection(getSectionLines(txt, 'Sonstiges'), 'sonstiges'); if(so.length) menu.sonstiges = so; localStorage.setItem('fullMenu', JSON.stringify(menu)); save(); closeAll(); alert("Einstellungen automatisch aktualisiert!"); }
 function makeLines(arr) { if(!arr) return ''; return arr.filter(i => !i.sub).map(i => i.n + ';' + i.p.toFixed(2)).join('\n'); }
